<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13051f">
  <title>KangBao AI 🐺</title>
   <link rel="icon" type="image/png" href="Gemini_Generated_Image_wpvrz2wpvrz2wpvr.png">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse at 15% 10%, #7026a5 0, transparent 42%),
        radial-gradient(ellipse at 90% 90%, #402080 0, transparent 40%),
        #0b0612;
      display: grid;
      place-items: center;
      padding: 12px;
    }
    .app {
      width: min(900px, 100%);
      height: min(850px, 95vh);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #ffffff25;
      border-radius: 24px;
      background: #160c22e8;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 90px #0008;
    }
    header {
      padding: 17px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #ffffff18;
    }
    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, #c084fc, #6d28d9);
      font-size: 27px;
    }
    .brand { flex: 1; min-width: 0; }
    .brand h1 { margin: 0; font-size: 21px; }
    #status { color: #c4b5fd; font-size: 12px; margin-top: 4px; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 15px;
      border-bottom: 1px solid #ffffff12;
    }
    button, select, input { font: inherit; }
    button, select {
      color: white;
      background: #281638;
      border: 1px solid #ffffff25;
      border-radius: 10px;
      padding: 9px 12px;
    }
    button { cursor: pointer; }
    button:hover { filter: brightness(1.2); }
    button:disabled { opacity: .55; cursor: wait; }
    select { min-width: 0; max-width: 100%; }
    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      scroll-behavior: smooth;
    }
    .message {
      max-width: 88%;
      padding: 13px 15px;
      border: 1px solid #ffffff18;
      border-radius: 17px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    .bot { align-self: flex-start; background: #8b5cf629; }
    .user { align-self: flex-end; background: #ffffff12; }
    .message-text { white-space: pre-wrap; }
    .actions { margin-top: 9px; }
    .copy { padding: 5px 9px; font-size: 12px; }
    .composer {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #ffffff18;
    }
    #prompt {
      min-width: 0;
      flex: 1;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid #ffffff25;
      background: #08040dcc;
      color: white;
      outline: none;
    }
    #prompt:focus { border-color: #c084fc; }
    #send {
      min-width: 55px;
      border: 0;
      font-size: 20px;
      background: linear-gradient(135deg, #a855f7, #6d28d9);
    }
    .hint { color: #b7a9c8; font-size: 11px; padding: 0 16px 10px; }
    @media (max-width: 550px) {
      .app { height: 95vh; border-radius: 18px; }
      .chat { padding: 13px; }
      .message { max-width: 96%; }
      header { padding: 13px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="logo">🐺</div>
      <div class="brand">
        <h1>KangBao AI</h1>
        <div id="status">Đang khởi động AI...</div>
      </div>
    </header>

    <div class="toolbar">
      <select id="model" aria-label="Chọn model AI">
        <option value="gemini-3.8-flash">Gemini Flash</option>
        <option value="gemini-3.5-flash-lite">Gemini Flash Lite</option>
      </select>
      <button id="clear" type="button">🗑 Xóa lịch sử</button>
    </div>

    <section class="chat" id="chat" aria-live="polite"></section>

    <form class="composer" id="form">
      <input id="prompt" maxlength="4000"
        placeholder="Hỏi gì đi bro... 🐺"
        autocomplete="off" required>
      <button id="send" type="submit" aria-label="Gửi tin nhắn">➤</button>
    </form>
    <div class="hint">KangBao AI có thể mắc lỗi. Hãy kiểm tra thông tin quan trọng.</div>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      initializeAppCheck,
      ReCaptchaEnterpriseProvider
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app-check.js";

    import {
      getAI,
      getGenerativeModel,
      GoogleAIBackend
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-ai.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA1hbGgpRvGOdwTWyUBVIRRiY-QdlYB_j8",
      authDomain: "kangbao-ai.firebaseapp.com",
      projectId: "kangbao-ai",
      storageBucket: "kangbao-ai.firebasestorage.app",
      messagingSenderId: "145602394125",
      appId: "1:145602394125:web:e5ec2a4144ef3a8d01bd44",
      measurementId: "G-WFWMX7X3M0"
    };

    // Site key reCAPTCHA Enterprise của KBAI
    const RECAPTCHA_SITE_KEY =
      "6LeH2PQtAAAAABW_JhKLSGiECmgRS4-p83rkqCgp";

    const HISTORY_KEY = "kangbao-ai-chat-v2";
    const SYSTEM_PROMPT = `
Bạn là KangBao AI, trợ lý AI của KangBao.
- Mặc định trả lời bằng tiếng Việt tự nhiên.
- Thân thiện, nhanh nhạy, có thể dùng meme và emoji đúng lúc.
- Có thể troll vui theo phong cách internet nhưng không xúc phạm người dùng.
- Khi người dùng cần hướng dẫn kỹ thuật, hãy đưa bước rõ ràng và chính xác.
- Không bịa ra việc đã thực hiện, đã kiểm tra hoặc đã truy cập.
- Nếu không biết, hãy nói rõ giới hạn của mình.
`;

    const $ = id => document.getElementById(id);
    const chatElement = $("chat");
    const promptInput = $("prompt");
    const sendButton = $("send");
    const modelSelect = $("model");
    const statusElement = $("status");

    let ai = null;
    let model = null;
    let chatSession = null;
    let busy = false;
    let history = [];

    try {
      const saved = JSON.parse(
        localStorage.getItem(HISTORY_KEY) || "[]"
      );
      if (Array.isArray(saved)) {
        history = saved.filter(item =>
          item &&
          ["user", "bot"].includes(item.role) &&
          typeof item.text === "string"
        ).slice(-100);
      }
    } catch {
      history = [];
    }

    function saveHistory() {
      try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      } catch (error) {
        console.warn("Không lưu được lịch sử:", error);
      }
    }

    function addMessage(text, role, save = true) {
      const bubble = document.createElement("article");
      bubble.className = "message " + role;

      const content = document.createElement("div");
      content.className = "message-text";
      content.textContent = text;
      bubble.appendChild(content);

      if (role === "bot") {
        const actions = document.createElement("div");
        actions.className = "actions";

        const copyButton = document.createElement("button");
        copyButton.className = "copy";
        copyButton.type = "button";
        copyButton.textContent = "📋 Sao chép";
        copyButton.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(text);
            copyButton.textContent = "✅ Đã sao chép";
          } catch {
            copyButton.textContent = "Không sao chép được";
          }
        });

        actions.appendChild(copyButton);
        bubble.appendChild(actions);
      }

      chatElement.appendChild(bubble);
      chatElement.scrollTop = chatElement.scrollHeight;

      if (save) {
        history.push({ role, text });
        history = history.slice(-100);
        saveHistory();
      }

      return bubble;
    }

    function renderHistory() {
      chatElement.replaceChildren();

      if (!history.length) {
        addMessage("Xin chào. Hỏi gì đi 🐺🔥", "bot", false);
        return;
      }

      for (const item of history) {
        addMessage(item.text, item.role, false);
      }
    }

    // Chuyển lịch sử ứng dụng sang định dạng hội thoại Gemini.
    function makeModelHistory() {
      const result = [];

      for (const item of history) {
        const entry = {
          role: item.role === "user" ? "user" : "model",
          parts: [{ text: item.text }]
        };

        // Gemini cần hội thoại bắt đầu bằng user và luân phiên vai trò.
        if (!result.length && entry.role !== "user") continue;
        if (result.length && result[result.length - 1].role === entry.role) {
          result[result.length - 1].parts[0].text +=
            "\n\n" + item.text;
        } else {
          result.push(entry);
        }
      }

      // Hội thoại đã lưu có thể kết thúc bằng user hoặc model.
      // Bỏ model cuối để bắt đầu lượt hỏi tiếp theo.
      if (result.length && result[result.length - 1].role === "model") {
        result.pop();
      }

      return result;
    }

    function createSession() {
      if (!ai) return;

      model = getGenerativeModel(ai, {
        model: modelSelect.value,
        systemInstruction: {
          parts: [{ text: SYSTEM_PROMPT }]
        },
        generationConfig: {
          temperature: 0.9,
          maxOutputTokens: 2048
        }
      });

      chatSession = model.startChat({
        history: makeModelHistory()
      });
    }

    function friendlyError(error) {
      const message = String(error?.message || error || "");
      const lower = message.toLowerCase();

      if (lower.includes("quota") || lower.includes("resource_exhausted")) {
        return "Gemini đã hết quota hoặc đang bị giới hạn lượt dùng. Hãy thử lại sau.";
      }

      if (lower.includes("app check") ||
          lower.includes("appcheck") ||
          lower.includes("403") ||
          lower.includes("401")) {
        return "Yêu cầu bị từ chối. Kiểm tra App Check, Site key, cấu hình Firebase và trạng thái enforcement.";
      }

      if (lower.includes("not found") ||
          lower.includes("not supported") ||
          lower.includes("model")) {
        return "Model có thể không được hỗ trợ cho project này. Thử model khác trong danh sách hoặc kiểm tra Firebase AI Logic.";
      }

      if (lower.includes("fetch") || lower.includes("network")) {
        return "Không kết nối được dịch vụ AI. Kiểm tra mạng rồi thử lại.";
      }

      return "Gemini gặp lỗi: " + message;
    }

    function initializeAI() {
      const app = initializeApp(firebaseConfig);

      // Phải khởi tạo App Check trước khi gọi Firebase AI Logic.
      initializeAppCheck(app, {
        provider: new ReCaptchaEnterpriseProvider(RECAPTCHA_SITE_KEY),
        isTokenAutoRefreshEnabled: true
      });

      ai = getAI(app, {
        backend: new GoogleAIBackend()
      });

      createSession();
      statusElement.textContent = "● Gemini đã khởi tạo";
    }

    renderHistory();

    try {
      initializeAI();
    } catch (error) {
      console.error(error);
      statusElement.textContent = "● Lỗi khởi tạo";
      addMessage(
        "Chưa khởi tạo được Firebase AI Logic.\n\n" +
        friendlyError(error),
        "bot"
      );
    }

    modelSelect.addEventListener("change", () => {
      if (!ai || busy) return;

      try {
        createSession();
        statusElement.textContent =
          "● Đã chọn " + modelSelect.options[modelSelect.selectedIndex].text;
      } catch (error) {
        console.error(error);
        statusElement.textContent = "● Không đổi được model";
        addMessage(friendlyError(error), "bot");
      }
    });

    $("clear").addEventListener("click", () => {
      if (busy) return;

      if (!confirm("Xóa toàn bộ lịch sử chat trên trình duyệt này?")) {
        return;
      }

      history = [];
      saveHistory();
      renderHistory();

      try {
        createSession();
      } catch (error) {
        console.error(error);
      }

      statusElement.textContent = "● Đã xóa lịch sử";
    });

    $("form").addEventListener("submit", async event => {
      event.preventDefault();

      const prompt = promptInput.value.trim();
      if (!prompt || busy) return;

      if (!chatSession) {
        addMessage(
          "AI chưa sẵn sàng. Kiểm tra lỗi cấu hình Firebase phía trên nhé.",
          "bot"
        );
        return;
      }

      busy = true;
      sendButton.disabled = true;
      modelSelect.disabled = true;
      statusElement.textContent = "● KangBao AI đang suy nghĩ...";

      addMessage(prompt, "user");
      promptInput.value = "";

      const loading = addMessage("Đang gọi Gemini... 🐺", "bot", false);

      try {
        const result = await chatSession.sendMessage(prompt);
        const answer = result.response.text();

        loading.remove();

        if (answer && answer.trim()) {
          addMessage(answer.trim(), "bot");
          statusElement.textContent = "● Gemini đã trả lời";
        } else {
          addMessage("Gemini trả về nội dung trống. Thử hỏi lại nhé.", "bot");
          statusElement.textContent = "● Không có nội dung";
        }
      } catch (error) {
        console.error(error);
        loading.remove();
        addMessage(friendlyError(error), "bot");
        statusElement.textContent = "● Gemini gặp lỗi";

        // Tạo lại session từ lịch sử đã lưu nếu request bị lỗi.
        try {
          createSession();
        } catch (sessionError) {
          console.error(sessionError);
        }
      } finally {
        busy = false;
        sendButton.disabled = false;
        modelSelect.disabled = false;
        promptInput.focus();
      }
    });
  </script>
</body>
</html>
```
