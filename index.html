<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KangBao AI</title>
    <link rel="icon" type="image/png" href="Gemini_Generated_Image_wpvrz2wpvrz2wpvr.png">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 20%, #6d28d9 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #3b0764 0%, transparent 35%),
        #09000f;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    backdrop-filter: blur(70px);
    pointer-events: none;
}

.app {
    position: relative;
    width: min(900px, 94vw);
    height: min(700px, 90vh);
    display: flex;
    flex-direction: column;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 28px;
    background: rgba(20, 5, 35, .55);
    backdrop-filter: blur(25px);
    box-shadow: 0 30px 100px rgba(0,0,0,.5);
    overflow: hidden;
}

.header {
    padding: 22px 28px;
    border-bottom: 1px solid rgba(255,255,255,.1);
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: 45px;
    height: 45px;
    border-radius: 14px;
    background: linear-gradient(135deg, #a855f7, #4c1d95);
    display: grid;
    place-items: center;
    font-size: 24px;
    box-shadow: 0 0 30px rgba(168,85,247,.4);
}

.title {
    font-size: 21px;
    font-weight: bold;
}

.status {
    font-size: 12px;
    color: #c084fc;
    margin-top: 3px;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.message {
    max-width: 75%;
    padding: 14px 18px;
    border-radius: 18px;
    line-height: 1.45;
    animation: pop .2s ease;
}

.bot {
    align-self: flex-start;
    background: rgba(139,92,246,.16);
    border: 1px solid rgba(168,85,247,.18);
}

.user {
    align-self: flex-end;
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.1);
}

.input-area {
    padding: 18px;
    border-top: 1px solid rgba(255,255,255,.1);
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 15px 18px;
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,.12);
    outline: none;
    background: rgba(0,0,0,.25);
    color: white;
    font-size: 15px;
}

input::placeholder {
    color: #9ca3af;
}

button {
    width: 55px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(168,85,247,.5);
}

@keyframes pop {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width:600px) {
    .app {
        width: 100%;
        height: 100vh;
        border-radius: 0;
    }

    .message {
        max-width: 90%;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">🐺</div>
        <div>
            <div class="title">KangBao AI</div>
            <div class="status">● Definitely an AI</div>
        </div>
    </div>

    <div class="chat" id="chat">
        <div class="message bot">
            Xin chào. Hỏi gì đi 🐺
        </div>
    </div>

    <div class="input-area">
        <input
            id="input"
            placeholder="Hỏi KangBao AI bất cứ thứ gì..."
            autocomplete="off"
        >
        <button onclick="send()">➤</button>
    </div>

</div>

<script>

const answers = [
    "HTML 100%",
    "OS HTML",
    "KangBao15 build OS on Web",
    "SIUU",
    ". . .",
    "KangBaoOS đang suy nghĩ...",
    "404 Brain Not Found",
    "bro what 💀",
    "HTML giải quyết tất cả",
    "OS? HTML.",
    "KangBao15 đã phán.",
    "nah",
    "💀",
    "SIUUUUUUUU",
    "Windows? HTML.",
    "Linux? HTML.",
    "Minecraft? HTML.",
    "AI? HTML.",
    "Không biết nhưng SIUU.",
    "Câu hỏi rất hay. Không biết.",
    "Tôi là AI mà 🗿",
    "KangBao AI.exe đã hoạt động.",
    "processing... . . .",
    "Absolutely nothing.",
    "yes",
    "no",
    "maybe",
    "KangBaoOS moment 🐺",
    "Xiaomi 17 ultra",
    "Samsung A03s",
    "Chill",
    "🗿🗿🗿",
    "Sigma boy🗿",
    "Mê nê nêm ni gia",
    "Chụp, chụp đi",
    "Athur siêu việt",
    "Chan bố mày đê, slomomo",
    "Chill thôi",
    "Dell inl 3543",
    "meow",
    "ayo chill",
    "Ronaldo. . siuuuuuuuuuuuuu",
    "Đi ngủ thôi",
    "Cái j?",
    "Anh ở vùng quê khu nghèo khó đó",
    "Chan đê",
    "OMG"
];

function send() {

    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    const text = input.value.trim();

    if (!text) return;

    const user = document.createElement("div");
    user.className = "message user";
    user.textContent = text;

    chat.appendChild(user);

    input.value = "";

    setTimeout(() => {

        const bot = document.createElement("div");
        bot.className = "message bot";

        const random =
            answers[Math.floor(Math.random() * answers.length)];

        bot.textContent = random;

        chat.appendChild(bot);

        chat.scrollTop = chat.scrollHeight;

    }, 250);
}

document.getElementById("input").addEventListener("keydown", e => {
    if (e.key === "Enter") {
        send();
    }
});

</script>

</body>
</html>
